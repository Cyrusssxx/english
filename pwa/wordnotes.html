        <h1 class="wn-title">熟词僻义</h1>
        <p class="wn-hint">
            <b>判义规则</b>：逐词回真题语料核对实际义项，<b>只收真题里真正考过「僻义」的词</b>——
            该词在真题句中的实际含义 ≠ 它最常见的含义（真题没考过僻义的词一律不收）。
            <b>熟义</b>取 ECDICT 常见义，<b>僻义</b>由真题例句反推，<b>原句</b>即该僻义的真题出处（句下为官方译文与本词出现过的年份）。
            译文只采信「英语二 2010+」的可靠逐句译文，其余来源只显示英文原句。
        </p>
