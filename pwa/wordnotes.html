    <style>
        .wn-page { width: 100%; max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: 16px 14px 72px; }
        .wn-title { font-size: 1.3rem; margin: 4px 0 6px; color: var(--text); }
        .wn-hint { color: var(--text-light); font-size: .84rem; line-height: 1.7; margin: 0 0 14px; }
        .wn-search {
            width: 100%; box-sizing: border-box; margin: 0 0 12px;
            padding: 8px 12px; font: inherit; font-size: .9rem;
            border: 1px solid var(--border); border-radius: 10px;
            background: var(--card); color: var(--text);
        }
        .wn-search:focus { outline: none; border-color: var(--primary); }
        .wn-count { color: var(--text-light); font-size: .84rem; margin: 0 0 8px; }
        .wn-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
        .wn-table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: .88rem; }
        .wn-table th, .wn-table td {
            border: 1px solid var(--border); padding: 8px 10px;
            vertical-align: top; text-align: left; line-height: 1.6;
        }
        .wn-table th {
            background: var(--primary-soft); color: var(--primary-dark);
            font-weight: 700; white-space: nowrap; position: sticky; top: 0;
        }
        .wn-table tbody tr:nth-child(even) { background: rgba(128, 128, 128, 0.04); }
        .wn-w { font-weight: 700; color: var(--primary); white-space: nowrap; width: 116px; }
        .wn-freq {
            width: 62px; text-align: right; color: var(--text-light); font-variant-numeric: tabular-nums;
        }
        .wn-common { width: 168px; color: var(--text); }
        .wn-uncommon { width: 208px; color: var(--text); font-weight: 600; }
        .wn-en { color: var(--text); font-family: Georgia, "Times New Roman", serif; }
        .wn-cn { color: var(--text-light); font-size: .84rem; margin-top: 3px; }
        .wn-src { color: var(--text-light); font-size: .75rem; margin-top: 3px; opacity: .8; }
        @media (max-width: 640px) {
            .wn-table { min-width: 0; }
            .wn-table, .wn-table thead, .wn-table tbody, .wn-table tr, .wn-table th, .wn-table td { display: block; width: auto !important; }
            .wn-table thead { display: none; }
            .wn-table tr { border-bottom: 3px solid var(--border); padding: 4px 0; }
            .wn-table td { border: none; padding: 4px 10px; }
            .wn-table td::before { content: attr(data-label); color: var(--text-light); font-size: .74rem; margin-right: 6px; }
        }
    </style>
</head>

        </div>

    <main class="wn-page">
        <h1 class="wn-title">熟词僻义</h1>
        <p class="wn-hint">
            <b>词频</b>＝该词在全部真题（阅读 / 完形 / 新题型 / 翻译）里出现的次数，<b>最常出现的排最上面</b> ·
            <b>熟义</b>＝常见义（ECDICT）·<b>僻义</b>＝真题实际考的特殊义（唐迟讲义，OCR＋人工核对）·
            <b>原句</b>只取含该词的短句（长句标「截取」），出处见句下小字。
        </p>
        <input id="wnSearch" class="wn-search" type="search" placeholder="搜索单词 / 释义（如 handsome、支撑）">
        <div id="wnContent"><p style="color:var(--text-light)">加载中…</p></div>
    </main>
