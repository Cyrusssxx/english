<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语一阅读 · 历年真题</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0d9488">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="en1.html" class="nav-brand">英一阅读</a>
            <div class="nav-links">
                <a href="en1.html" class="nav-link active">英语一阅读</a>
                <a href="index.html" class="nav-link">英语二精翻</a>
                <a href="mindmap.html" class="nav-link">方法导图</a>
                <a href="nearmap.html" class="nav-link">近义词</a>
                <a href="wordnotes.html" class="nav-link">熟词僻义</a>
                <a href="phrasebook.html" class="nav-link">熟词短语</a>
                <a href="mistakes.html" class="nav-link">错题本</a>
                <a href="stats.html" class="nav-link">统计</a>
            </div>
            <div class="nav-tools">
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()" title="夜间模式：深色主题护眼">
                    夜间 <span class="switch-state" id="darkState">关</span>
                </button>
            </div>
        </div>
    </nav>
    <main class="container">
        <div class="hero">
            <h1>考研英语一 · 历年阅读真题</h1>
            <p class="subtitle">2010–2025 Text 1–4 · 逐句精翻 · 词组注释 · 做题解析，完全离线可用</p>
        </div>

        <!-- 继续学习 -->
        <div class="continue-bar" id="continueBar" style="display:none">
            <div>
                <div class="cb-title" id="cbTitle"></div>
                <div class="cb-sub" id="cbSub"></div>
            </div>
            <a id="cbLink" href="#">继续学习 →</a>
        </div>

        <!-- 按类型刷（话题分类） -->
        <div class="topic-tabs" id="topicTabs"></div>
        <div class="topic-hint" id="topicHint" style="display:none">按话题跨年份刷题（英语一 · 阅读 Text1-4，按年份新旧排序）</div>

        <!-- 年份 Tab -->
        <div class="year-tabs" id="yearTabs"></div>

        <!-- 文章列表 -->
        <div class="article-list" id="articleList">
            <div class="loading">加载中...</div>
        </div>
    </main>
    <script src="js/common.js"></script>
    <script src="js/storage.js"></script>
    <script>
        let idx = null;
        let curYear = null;
        let answerStats = {};
        let topicMap = null;
        let curTopic = '';

        async function init() {
            try {
                idx = await loadEn1Index();
            } catch (e) {
                document.getElementById('articleList').innerHTML =
                    `<div class="error">加载失败: ${esc(e.message)}<br>请用 start.bat 启动后访问 http://localhost:8410</div>`;
                return;
            }
            for (const a of await dbAll('quiz_answers')) {
                if (!a.article_id || !a.article_id.startsWith('en1_')) continue;
                const st = answerStats[a.article_id] || (answerStats[a.article_id] = { answered: 0, correct: 0 });
                st.answered++;
                if (a.is_correct) st.correct++;
            }
            renderContinue();
            // 按类型刷：加载话题分类映射
            try {
                topicMap = await fetchJSON('data/topic_map.json');
            } catch (e) { topicMap = null; }
            const savedTopic = localStorage.getItem('en1_lastTopic') || '';
            curTopic = (savedTopic && topicMap && Object.values(topicMap).some(v => v.cat === savedTopic)) ? savedTopic : '';
            renderTopicTabs();
            const years = idx.years.map(y => y.year).sort((a, b) => b - a);
            const saved = parseInt(localStorage.getItem('en1_lastYear') || '0', 10);
            curYear = years.includes(saved) ? saved : years[0];
            renderTabs(years);
            renderList();
        }

        function renderContinue() {
            const last = localStorage.getItem('lastArticle');
            if (!last || !last.startsWith('en1_')) return;
            let found = null, foundYear = null;
            for (const y of idx.years) {
                const a = y.articles.find(x => x.id === last);
                if (a) { found = a; foundYear = y.year; break; }
            }
            if (!found) return;
            document.getElementById('cbTitle').textContent = `${foundYear} 英语一 · ${TYPE_NAMES[found.type] || found.type}`;
            document.getElementById('cbSub').textContent = found.title || '';
            document.getElementById('cbSub').style.display = 'none';
            document.getElementById('cbLink').href = `article.html?id=${found.id}`;
            document.getElementById('continueBar').style.display = '';
        }

        function renderTabs(years) {
            document.getElementById('yearTabs').innerHTML = years.map(y =>
                `<button class="year-tab ${y === curYear ? 'active' : ''}" onclick="pickYear(${y})">${y}</button>`).join('');
        }

        function pickYear(y) {
            curYear = y;
            localStorage.setItem('en1_lastYear', String(y));
            renderTabs(idx.years.map(x => x.year).sort((a, b) => b - a));
            renderList();
        }

        function rateBadge(st) {
            // 正确率配色：≤2/5(40%) 红｜3/5~4/5 黄｜5/5 绿
            const rate = st.correct / st.answered;
            const cls = rate <= 0.4 ? 'ac-rate r-red' : (rate < 1 ? 'ac-rate r-yellow' : 'ac-rate r-green');
            return '<span class="' + cls + '">' + st.correct + '/' + st.answered + ' · ' + Math.round(rate * 100) + '%</span>';
        }

        const TOPIC_CATS = ['政法', '商业经济', '科学科技', '教育文化历史', '社会生活'];

        function renderTopicTabs() {
            const el = document.getElementById('topicTabs');
            const hint = document.getElementById('topicHint');
            el.innerHTML = ['全部', ...TOPIC_CATS].map(c =>
                `<button class="topic-tab ${(c === '全部' ? !curTopic : curTopic === c) ? 'active' : ''}" onclick="pickTopic('${c === '全部' ? '' : c}')">${c}</button>`).join('');
            hint.style.display = curTopic ? '' : 'none';
            document.getElementById('yearTabs').style.display = curTopic ? 'none' : '';
        }

        function pickTopic(c) {
            curTopic = c;
            localStorage.setItem('en1_lastTopic', c);
            renderTopicTabs();
            renderList();
        }

        function cardHtml(a, showYear) {
            const st = answerStats[a.id];
            const isLast = localStorage.getItem('lastArticle') === a.id;
            let right = '';
            if (isLast) right += '<span class="ac-badge">● 上次学习</span>';
            if (st && st.answered) right += rateBadge(st);
            const yearTag = showYear ? `<span class="ac-year">${a.year}</span>` : '';
            return `
                <a class="article-card" href="article.html?id=${a.id}">
                    <div class="ac-main">
                        ${yearTag}
                        <span class="ac-type">${TYPE_NAMES[a.type] || a.type}</span>
                    </div>
                    <div class="ac-right">${right}<span class="ac-arrow">→</span></div>
                </a>`;
        }

        function renderList() {
            if (curTopic) {
                // 按话题跨年刷题：只取阅读 text1-4
                const arts = [];
                for (const y of idx.years) {
                    for (const a of y.articles) {
                        if (!/^text[1-4]$/.test(a.type)) continue;
                        const tm = topicMap ? topicMap[a.id] : null;
                        if (tm && tm.cat === curTopic) arts.push({ a, year: y.year });
                    }
                }
                arts.sort((x, y) => y.year - x.year || x.a.type.localeCompare(y.a.type));
                if (!arts.length) {
                    document.getElementById('articleList').innerHTML = '<div class="empty">该话题暂无阅读文章</div>';
                    return;
                }
                document.getElementById('articleList').innerHTML = arts.map(x => cardHtml({ ...x.a, year: x.year }, true)).join('');
                return;
            }
            const yearData = idx.years.find(y => y.year === curYear);
            if (!yearData || !yearData.articles.length) {
                document.getElementById('articleList').innerHTML = '<div class="empty">该年份暂无内容</div>';
                return;
            }
            const order = ['text1', 'text2', 'text3', 'text4'];
            const arts = [...yearData.articles].sort((a, b) => order.indexOf(a.type) - order.indexOf(b.type));
            document.getElementById('articleList').innerHTML = arts.map(a => cardHtml(a, false)).join('');
        }

        init();
    </script>
</body>
</html>
