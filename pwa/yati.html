<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作文押题 26 篇 · 英语二</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0d9488">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>document.documentElement.classList.add('wr-zoom');if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">英二精翻</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">真题文章</a>
                <a href="study.html" class="nav-link">背单词</a>
                <a href="en1.html" class="nav-link">英语一阅读</a>
                <a href="mindmap.html" class="nav-link">方法导图</a>
                <a href="nearmap.html" class="nav-link">近义词·短语</a>
                <a href="wordnotes.html" class="nav-link">熟词僻义</a>
                <a href="writing.html" class="nav-link">大作文</a>
                <a href="smallwriting.html" class="nav-link">小作文</a>
                <a href="yati.html" class="nav-link active">押题</a>
                <a href="recite.html" class="nav-link">写作词库</a>
                <a href="stats.html" class="nav-link">统计</a>
            </div>
            <div class="nav-tools">
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()" title="夜间模式：深色主题护眼">
                    夜间 <span class="switch-state" id="darkState">关</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="wr-layout yt-layout">
        <aside class="wr-toc" id="ytToc" aria-label="题型目录">
            <div class="wr-toc-head">
                <span class="wr-toc-title">目录</span>
                <button type="button" class="wr-toc-fold" id="ytTocFold" onclick="ytTocToggleFold()" title="收起目录">‹ 收起</button>
            </div>
            <nav class="wr-toc-list" id="ytTocList"></nav>
        </aside>
        <button type="button" class="wr-toc-tab" id="ytTocTab" onclick="ytTocOpen()" title="展开目录">目录</button>
        <div class="wr-toc-mask" id="ytTocMask" onclick="ytTocClose()" hidden></div>

        <main class="wr-page yt-page">
            <header class="yt-hero">
                <p class="yt-kicker">2027 英语二 · 冲刺押题</p>
                <h1 class="yt-h1">作文押题 26 篇</h1>
                <p class="yt-sub">先看原题图自己写一遍，再对照配套范文。<b>图按需加载</b>：展开哪组才载哪组的图，看过的不会再下载；范文顶部附「图内文字 · 英文写法」。</p>
                <div class="yt-stats" id="ytStats"></div>
            </header>

            <div class="yt-bar" id="ytBar">
                <div class="yt-search">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12.8 12.8 L17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                    <input type="search" id="ytSearch" placeholder="搜题号或标题，如 17 / 绿色 / 邀请" autocomplete="off">
                </div>
                <button type="button" class="yt-btn" id="ytToggleAll">展开全部</button>
            </div>

            <div id="ytGroups" class="yt-groups"></div>
            <p class="yt-empty" id="ytEmpty" hidden>没有匹配的题目，换个关键词试试。</p>
        </main>
    </div>

    <!-- 阅读弹层：左原图 / 右范文；窄屏用上方 tab 切换 -->
    <div class="yt-modal" id="ytModal" hidden>
        <div class="yt-mask" data-close></div>
        <div class="yt-box" role="dialog" aria-modal="true" aria-labelledby="ytMTitle">
            <header class="yt-mh">
                <div class="yt-mh-l">
                    <span class="yt-no" id="ytMNo">01</span>
                    <div class="yt-mh-txt">
                        <h3 id="ytMTitle">题目</h3>
                        <p id="ytMSub"></p>
                        <p id="ytMEn" class="yt-mh-en" hidden></p>
                    </div>
                </div>
                <div class="yt-tabs" id="ytMTabs">
                    <button type="button" data-pane="img" class="on">原题图</button>
                    <button type="button" data-pane="txt">范文</button>
                </div>
                <button type="button" class="yt-x" data-close aria-label="关闭">✕</button>
            </header>
            <div class="yt-mbody" id="ytMBody">
                <div class="yt-pane yt-pane-img" data-pane="img">
                    <div class="yt-mzoom">
                        <img id="ytMImg" alt="">
                    </div>
                </div>
                <div class="yt-pane yt-pane-txt" data-pane="txt">
                    <div class="yt-txt-bar">
                        <span class="yt-txt-label">范文</span>
                        <span class="yt-txt-btns">
                            <button type="button" class="yt-cn-btn" id="ytSentBtn" title="只展开/收起每句下方的中文，不显示整篇对照">显示逐句译文</button>
                            <button type="button" class="yt-cn-btn" id="ytCnBtn" title="只显示/隐藏整篇中文对照，不影响逐句译块">显示全文译文</button>
                        </span>
                    </div>
                    <div class="yt-essay" id="ytMEssay"></div>
                </div>
            </div>
            <footer class="yt-mf">
                <button type="button" id="ytPrev">← 上一题</button>
                <span class="yt-mf-c"><span id="ytMCnt">1 / 26</span><span class="yt-kb">← → 可切换</span></span>
                <button type="button" id="ytNext">下一题 →</button>
            </footer>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/dict.js"></script>
    <script src="js/kwpop.js"></script>
    <script src="js/yati.js"></script>
</body>
</html>
