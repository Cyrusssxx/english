<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作文模板 - 英语真题精翻</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0d9488">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">英二精翻</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">真题文章</a>
                <a href="study.html" class="nav-link">背单词</a>
                <a href="vocab.html" class="nav-link">单词本</a>
                <a href="en1.html" class="nav-link">英语一阅读</a>
                <a href="mindmap.html" class="nav-link">方法导图</a>
                <a href="nearmap.html" class="nav-link">近义词</a>
                <a href="wordnotes.html" class="nav-link">熟词僻义</a>
                <a href="phrasebook.html" class="nav-link">熟词短语</a>
                <a href="writing.html" class="nav-link active">作文模板</a>
                <a href="mistakes.html" class="nav-link">错题本</a>
                <a href="stats.html" class="nav-link">统计</a>
            </div>
            <div class="nav-tools">
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()" title="夜间模式：深色主题护眼">
                    夜间 <span class="switch-state" id="darkState">关</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="wr-layout">
        <!-- 悬浮目录 -->
        <aside class="wr-toc" id="wrToc" aria-label="页面目录">
            <div class="wr-toc-head">
                <span class="wr-toc-title">目录</span>
                <button type="button" class="wr-toc-fold" id="wrTocFold" onclick="wrTocToggleFold()" title="收起目录">‹ 收起</button>
            </div>
            <nav class="wr-toc-list" id="wrTocList"></nav>
        </aside>
        <button type="button" class="wr-toc-tab" id="wrTocTab" onclick="wrTocOpen()" title="展开目录">目录</button>
        <div class="wr-toc-mask" id="wrTocMask" onclick="wrTocClose()" hidden></div>

        <main class="wr-page">
            <h1 class="wr-title" id="wrTitle">作文模板库</h1>
            <p class="wr-desc" id="wrDesc"></p>
            <div class="wr-rules" id="wrRules"></div>

            <!-- 图表适配表 -->
            <section class="wr-block" id="wrGuideBlock">
                <h2 class="wr-h2" id="wrGuideTitle"></h2>
                <p class="wr-note" id="wrGuideDesc"></p>
                <div class="wr-table-wrap">
                    <table class="wr-table" id="wrChartTable">
                        <thead><tr><th>年份</th><th>图表</th><th>事物数</th><th>走势特征</th><th>类型</th><th>套用要点</th><th>真题套用示范</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <h3 class="wr-h3" id="wrDecisionsTitle">选句决策（按结构挑句，而非整段硬套）</h3>
                <div class="wr-decisions" id="wrDecisions"></div>
            </section>

            <!-- 模板分区 -->
            <div id="wrContent"><p class="wr-loading">加载中…</p></div>
        </main>
    </div>

    <script src="js/common.js"></script>
    <script src="js/writing.js"></script>
</body>
</html>
