<!DOCTYPE html>
<html lang="zh-CN" class="sw-zoom">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小作文功能句库 - 英语真题精翻</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0d9488">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">英二精翻</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">真题文章</a>
                <a href="study.html" class="nav-link">背单词</a>
                <a href="en1.html" class="nav-link">英语一阅读</a>
                <a href="mindmap.html" class="nav-link">方法导图</a>
                <a href="nearmap.html" class="nav-link">近义词·短语</a>
                <a href="wordnotes.html" class="nav-link">熟词僻义</a>
                <a href="writing.html" class="nav-link">大作文</a>
                <a href="smallwriting.html" class="nav-link active">小作文</a>
                <a href="recite.html" class="nav-link">速记页</a>
                <a href="stats.html" class="nav-link">统计</a>
            </div>
            <div class="nav-tools">
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()" title="夜间模式：深色主题护眼">
                    夜间 <span class="switch-state" id="darkState">关</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="wr-layout">
        <aside class="wr-toc" id="swToc" aria-label="页面目录">
            <div class="wr-toc-head">
                <span class="wr-toc-title">目录</span>
                <button type="button" class="wr-toc-fold" id="swTocFold" onclick="swTocToggleFold()" title="收起目录">‹ 收起</button>
            </div>
            <nav class="wr-toc-list" id="swTocList"></nav>
        </aside>
        <button type="button" class="wr-toc-tab" id="swTocTab" onclick="swTocOpen()" title="展开目录">目录</button>
        <div class="wr-toc-mask" id="swTocMask" onclick="swTocClose()" hidden></div>

    <main class="sw-page">
        <h1 class="sw-title" id="swTitle">📝 小作文功能句库</h1>
        <p class="sw-desc" id="swDesc">加载中…</p>
        <div class="sw-hero" id="swStats"></div>

        <details class="wr-legend sw-legend" id="swLegend"></details>

        <section class="sw-block" id="swStepsBlock">
            <h2 class="sw-h2" id="swStepsTitle">🧩 小作文怎么拼（3 段 · 5 步）</h2>
            <div class="sw-steps" id="swSteps"></div>
        </section>

        <section class="sw-block" id="swTeacherBlock">
            <h2 class="sw-h2" id="swTeacherTitle">🎓 评分老师怎么看这份模板 <small>英二 A 节 · 10 分</small></h2>
            <div class="sw-decs" id="swTeacher"></div>
        </section>

        <section class="sw-block" id="swGuideBlock">
            <h2 class="sw-h2">📊 真题适配表 <small>2010–2026 英语二 A 节，共 17 套</small></h2>
            <p class="sw-block-tip">先看每一年的<b>题型</b>与<b>该挑哪几句</b>，再往下到「按信件类型」里照单取句；主题列可点原文核对题干。</p>
            <div id="swGuide"></div>
        </section>

        <section class="sw-block" id="swDecisionsBlock">
            <h2 class="sw-h2" id="swDecisionsTitle">🎯 选句决策 <small>题干 → 挑哪几句</small></h2>
            <div class="sw-decs" id="swDecisions"></div>
        </section>

        <div class="sw-viewbar">
            <span class="sw-view-tip">看句子的方式：</span>
            <button type="button" class="sw-vbtn on" data-view="part">按段落</button>
            <button type="button" class="sw-vbtn" data-view="type">按信件类型</button>
            <button type="button" class="sw-expand" id="swExpandBtn">展开全部</button>
            <span class="sw-hl-tip">✍ 选中任意文字可<b>高亮</b>／写<b>批注</b>（已高亮 <span id="swMkCount">0</span> 处）</span>
        </div>

        <div id="swContent"><p style="color:var(--text-light)">加载中…</p></div>

        <div class="sw-study" id="swStudy"></div>
    </main>
    </div>

    <script src="js/common.js"></script>
    <script src="js/smallwriting.js"></script>
</body>
</html>
