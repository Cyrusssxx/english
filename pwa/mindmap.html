<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方法导图 - 英语真题精翻</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0d9488">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .mm-page { width: 100%; max-width: 100%; box-sizing: border-box; padding: 16px 14px 72px; }
        .mm-page-title { font-size: 1.3rem; margin: 4px 0 6px; color: var(--text); }
        .scroll-hint { color: var(--text-light); font-size: .82rem; margin: 0 0 18px; }
        .map-section { margin-bottom: 34px; }
        .map-h { font-size: 1.12rem; margin: 0 0 14px; padding-left: 12px; border-left: 5px solid var(--primary); color: var(--text); }
        .map-intro {
            color: var(--text-light); font-size: 0.92rem; line-height: 1.7;
            background: var(--card); border: 1px solid var(--border); border-radius: 10px;
            padding: 12px 16px; margin: 0 0 16px;
        }
        .mm-cols { display: flex; gap: 14px; align-items: flex-start; overflow-x: auto; padding-bottom: 10px; }
        .mm-col {
            flex: 1 1 0; min-width: 260px; background: var(--card);
            border: 1px solid var(--border); border-top: 4px solid var(--c);
            border-radius: 12px; padding: 12px 14px;
        }
        /* 拆分列：外层占 2 份宽度，内部子项铺成 2 列网格，各占一半 */
        .mm-col-split { flex: 2 1 0; min-width: 540px; }
        .mm-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .mm-split > .sub { margin-top: 0; }
        .mm-col-head {
            font-size: 1.02rem; font-weight: 700; color: var(--c);
            margin: 0 0 10px; padding-bottom: 8px; border-bottom: 2px solid var(--c);
        }
        .branch-body { display: flex; flex-direction: column; gap: 8px; }
        .sub { margin-top: 4px; }
        .sub-title {
            font-size: 0.92rem; font-weight: 600; color: var(--text);
            padding-left: 10px; border-left: 3px solid var(--c); margin: 10px 0 8px;
        }
        .sub .branch-body { gap: 6px; }
        .leaf-row {
            font-size: 0.9rem; line-height: 1.55; color: var(--text);
            padding: 7px 11px; border-radius: 8px; background: var(--bg);
            border: 1px solid var(--border);
        }
        .dark .leaf-row { background: #1f2937; }
        .leaf-row b { color: var(--c); font-weight: 700; }
        .leaf-row:hover { border-color: var(--c); }
        .leaf-row {
            display: flex; align-items: flex-start; gap: 6px; flex-wrap: wrap;
            cursor: pointer; user-select: none; transition: background .15s, border-color .15s;
        }
        .leaf-row .leaf-text { flex: 1 1 auto; min-width: 0; }
        .leaf-row.hl { background: #ffe680 !important; border-color: #f59e0b !important; }
        .dark .leaf-row.hl { background: #6b5d1f !important; border-color: #f59e0b !important; }
        .leaf-row.has-note { background: #fffbe6 !important; border-color: #f59e0b !important; }
        .dark .leaf-row.has-note { background: #4a4320 !important; border-color: #f59e0b !important; }
        .note-toggle {
            flex: 0 0 auto; width: 24px; height: 24px; line-height: 1; margin-top: 1px;
            border: 1px solid var(--border); background: var(--card); color: var(--text-light);
            border-radius: 6px; cursor: pointer; font-size: .8rem; padding: 0; transition: all .15s;
        }
        .note-toggle:hover { border-color: var(--primary); color: var(--primary); }
        .note-toggle.active { background: #fff3a3; border-color: #f59e0b; }
        .dark .note-toggle.active { background: #6b5e1a; }
        .note-panel {
            flex-basis: 100%; margin-top: 8px; padding: 10px 12px;
            background: var(--card); border: 1px solid var(--border); border-radius: 10px;
        }
        .note-toolbar { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding: 4px 2px 8px; border-bottom: 1px dashed var(--border); }
        .note-toolbar button {
            background: none; border: 1px solid transparent; color: var(--text-light);
            cursor: pointer; width: 26px; height: 26px; border-radius: 4px; font-size: .85rem; padding: 0;
        }
        .note-toolbar button:hover { border-color: var(--border); background: rgba(128,128,128,.08); }
        .note-toolbar button[data-cmd="h1"], .note-toolbar button[data-cmd="h2"], .note-toolbar button[data-cmd="clear"] { width: auto; padding: 0 8px; font-weight: 600; }
        .note-toolbar-sep { display: inline-block; width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
        .note-hl-dot { display: inline-block; width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(128,128,128,.3); cursor: pointer; transition: transform .1s; }
        .note-hl-dot:hover { transform: scale(1.15); }
        .note-input {
            width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
            font-size: .88rem; font-family: inherit; min-height: 54px; line-height: 1.5;
            word-break: break-word; white-space: pre-wrap;
        }
        .note-input:focus { outline: none; border-color: var(--primary); }
        .note-input:empty::before, .note-input.is-empty::before {
            content: attr(data-placeholder); color: var(--text-light); opacity: .6; pointer-events: none;
        }
        .note-input h1 { font-size: 1.2rem; font-weight: 700; margin: .3em 0 .15em; }
        .note-input h2 { font-size: 1.05rem; font-weight: 700; margin: .3em 0 .15em; }
        .note-input p { margin: .2em 0; }
        .note-input blockquote { border-left: 3px solid var(--border); margin: .3em 0; padding-left: 8px; color: var(--text-light); }
        .note-input .hl-yellow, .note-input [style*="background:#fff3a3"] { background: #fff3a3 !important; }
        .note-input .hl-green, .note-input [style*="background:#b8e6c0"] { background: #b8e6c0 !important; }
        .note-input .hl-blue, .note-input [style*="background:#b3d9f2"] { background: #b3d9f2 !important; }
        .note-input .hl-pink, .note-input [style*="background:#f5c2d5"] { background: #f5c2d5 !important; }
        .note-actions { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .note-save-btn {
            font: inherit; font-size: .82rem; padding: 5px 14px; border-radius: 8px;
            border: 1px solid var(--primary); background: var(--primary); color: #fff; cursor: pointer;
        }
        .note-save-btn.saved { opacity: .5; }
        .note-hint { font-size: .8rem; color: #16a34a; }
        .dark .note-hint { color: #4ade80; }
        .mm-tools { display: flex; align-items: center; gap: 14px; margin: 0 0 14px; flex-wrap: wrap; }
        .mm-tools-tip { color: var(--text-light); font-size: .82rem; }
        .mm-clear-btn {
            font: inherit; font-size: .82rem; cursor: pointer;
            padding: 5px 12px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--card); color: var(--text);
        }
        .mm-clear-btn:hover { border-color: var(--primary); color: var(--primary); }
    </style>
</head>
<body>

        <div class="nav-container">
            <a href="index.html" class="nav-brand">英二精翻</a>

                <a href="mindmap.html" class="nav-link active">方法导图</a>
                <a href="mistakes.html" class="nav-link">错题本</a>
                <a href="suggestions.html" class="nav-link">建议</a>

            <div class="nav-tools">
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()" title="夜间模式：深色主题护眼">
                    夜间 <span class="switch-state" id="darkState">关</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="mm-page">
        <h1 class="mm-page-title">考研阅读方法导图</h1>
        <p class="scroll-hint">横向滑动查看每一列 · 态度词 3 列 / 阅读一张纸 4 列（题型拆成双列各占一半）</p>
        <div class="mm-tools">
            <span class="mm-tools-tip">点任意条目即高亮标记 · 再点取消</span>
            <button type="button" class="mm-clear-btn" onclick="clearHighlights()">清除高亮</button>
        </div>
        <div id="mmContent"></div>
    </main>

    <script src="js/common.js"></script>
    <script src="js/mindmap.js"></script>
</body>
