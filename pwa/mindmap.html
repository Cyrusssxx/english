<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方法导图 - 英语真题精翻</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0d9488">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .mm-page { max-width: 940px; margin: 0 auto; padding: 20px 16px 64px; }
        .mm-tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
        .mm-tab {
            padding: 9px 20px; border-radius: 999px; border: 1px solid var(--border);
            background: var(--card); color: var(--text-light); cursor: pointer;
            font-size: 0.95rem; transition: all .15s;
        }
        .mm-tab:hover { border-color: var(--primary); color: var(--primary); }
        .mm-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .map-panel { display: none; }
        .map-panel.active { display: block; animation: mmFade .2s ease; }
        @keyframes mmFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
        .map-intro {
            color: var(--text-light); font-size: 0.92rem; line-height: 1.7;
            background: var(--card); border: 1px solid var(--border); border-radius: 10px;
            padding: 12px 16px; margin: 0 0 18px;
        }
        .branch-card {
            background: var(--card); border: 1px solid var(--border);
            border-left: 5px solid var(--c); border-radius: 12px;
            padding: 16px 18px; margin-bottom: 16px;
        }
        .branch-title {
            margin: 0 0 12px; font-size: 1.08rem; font-weight: 700; color: var(--c);
        }
        .branch-body { display: flex; flex-direction: column; gap: 8px; }
        .sub { margin-top: 4px; }
        .sub-title {
            font-size: 0.95rem; font-weight: 600; color: var(--text);
            padding-left: 10px; border-left: 3px solid var(--c); margin: 10px 0 8px;
        }
        .sub .branch-body { gap: 6px; }
        .leaf-row {
            font-size: 0.92rem; line-height: 1.5; color: var(--text);
            padding: 8px 12px; border-radius: 8px; background: var(--bg);
            border: 1px solid var(--border);
        }
        .dark .leaf-row { background: #1f2937; }
        .leaf-row b { color: var(--c); font-weight: 700; }
        .leaf-row:hover { border-color: var(--c); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">英二精翻</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">真题文章</a>
                <a href="study.html" class="nav-link">背单词</a>
                <a href="vocab.html" class="nav-link">单词本</a>
                <a href="favorites.html" class="nav-link">句子收藏</a>
                <a href="en1.html" class="nav-link">英语一阅读</a>
                <a href="chain.html" class="nav-link">串联词汇</a>
                <a href="mindmap.html" class="nav-link active">方法导图</a>
            </div>
            <div class="nav-tools">
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()" title="夜间模式：深色主题护眼">
                    夜间 <span class="switch-state" id="darkState">关</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="mm-page">
        <div class="mm-tabs" id="mmTabs"></div>
        <div id="mmContent"></div>
    </main>

    <script src="js/common.js"></script>
    <script src="js/mindmap.js"></script>
</body>
</html>
