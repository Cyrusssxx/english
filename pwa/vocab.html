<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词本 - 英语二真题精翻</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0d9488">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">英二精翻</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">真题文章</a>
                <a href="study.html" class="nav-link">背单词</a>
                <a href="vocab.html" class="nav-link active">单词本</a>
                <a href="favorites.html" class="nav-link">句子收藏</a>
            </div>
            <div class="nav-tools">
                <span class="nav-timer" id="navTimer">⏱ 00:00:00</span>
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()">
                    夜间 <span class="switch-state" id="darkState">关</span>
                </button>
            </div>
        </div>
    </nav>
    <main class="container">
        <div class="hero">
            <h1>单词本</h1>
            <p class="subtitle" id="vocabCount"></p>
        </div>
        <div class="deck-tabs" id="deckTabs"></div>
        <div class="deck-toolbar" id="deckToolbar"></div>
        <input type="file" id="deckImport" accept="application/json,.json" style="display:none" onchange="onImportDeck(this)">
        <div class="item-list" id="vocabList">
            <div class="loading">加载中...</div>
        </div>
    </main>
    <script src="js/common.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/dict.js"></script>
    <script>
        function dayStr(offset = 0) {
            const d = new Date();
            d.setDate(d.getDate() + offset);
            return d.toISOString().slice(0, 10);
        }
        let viewDeck = '__all__';   // 当前查看的词书（__all__ = 全部）
        const PAGE = 60;            // 分页：每次渲染 60 张卡片，避免大词书全量塞 DOM 卡顿
        let curRows = [], shown = 0, curCta = '';
        let curActive = 'default';   // 当前收藏目标词书（渲染列表时刷新，决定 per-card ★ 亮灭）

        async function renderAll() {
            await renderDeckBar();
            await renderList();
        }

        async function renderDeckBar() {
            const counts = await deckCounts();
            const active = getActiveDeck();
            let tabs = `<button class="deck-tab ${viewDeck === '__all__' ? 'on' : ''}" onclick="selectView('__all__')">全部 <span class="dt-count">${counts['__all__'] || 0}</span></button>`;
            for (const d of getDecks()) {
                const star = d.id === active ? '<span class="dt-star" title="当前收藏目标">★</span>' : '';
                tabs += `<button class="deck-tab ${viewDeck === d.id ? 'on' : ''}" onclick="selectView('${esc(d.id)}')">${esc(d.name)}${star} <span class="dt-count">${counts[d.id] || 0}</span></button>`;
            }
            tabs += `<button class="deck-add" onclick="onCreateDeck()">＋ 新建词书</button>`;
            tabs += `<button class="deck-add" onclick="onDeckImportHelp()">导入词书</button>`;
            tabs += `<button class="deck-add" onclick="onBuiltinDecks()">内置词书</button>`;
            document.getElementById('deckTabs').innerHTML = tabs;

            const tb = document.getElementById('deckToolbar');
            if (viewDeck === '__all__') {
                tb.innerHTML = `<span class="tb-info">当前收藏目标：<b>${esc(deckName(active))}</b></span>
                    <a class="tb-btn" href="study.html?deck=__all__">背全部 →</a>
                    <button class="tb-btn" onclick="onRelearnDeck('__all__')">重学全部</button>`;
            } else {
                const d = getDeck(viewDeck);
                let btns = `<span class="tb-info">当前查看：<b>${esc(d ? d.name : '')}</b></span>`;
                btns += viewDeck === active
                    ? `<span class="tb-tag">收藏目标 ★</span>`
                    : `<button class="tb-btn" onclick="onSetActive('${esc(viewDeck)}')">设为收藏目标</button>`;
                btns += `<a class="tb-btn" href="study.html?deck=${esc(viewDeck)}">背这本 →</a>`;
                btns += `<button class="tb-btn" onclick="onRelearnDeck('${esc(viewDeck)}')">重学本书</button>`;
                if (!(d && d.builtin)) {
                    btns += `<button class="tb-btn" onclick="onRenameDeck('${esc(viewDeck)}')">重命名</button>`;
                    btns += `<button class="tb-btn danger" onclick="onDeleteDeck('${esc(viewDeck)}')">删除词书</button>`;
                }
                tb.innerHTML = btns;
            }
            // 词书迷你进度
            const st = await deckStats(viewDeck);
            tb.innerHTML += `<div class="deck-mini-stat">新词 <b>${st.newCount}</b> · 学习中 <b>${st.learning}</b> · 已掌握 <b>${st.mastered}</b> · 今日待复习 <b>${st.dueToday}</b></div>`;
        }

        async function renderList() {
            curActive = getActiveDeck();
            const src = await vocabByDeck(viewDeck);
            curRows = src.sort((a, b) => (b.added_at || '').localeCompare(a.added_at || ''));
            document.getElementById('vocabCount').textContent = curRows.length ? `共 ${curRows.length} 个词/词组` : '';
            if (!curRows.length) {
                document.getElementById('vocabList').innerHTML = '<div class="empty">这本词书还没有词。精读时点下划线词加入，或用「记录生词」「导入词书」批量添加。</div>';
                return;
            }
            const today = dayStr(0);
            const due = curRows.filter(v => !v.srs || (v.srs.due && v.srs.due <= today)).length;
            const cta = due
                ? `<div class="sc-main"><b>今日待背 ${due} 个词</b><div class="sc-sub">单词卡 · 间隔重复 · 可离线</div></div><span class="sc-go">开始背单词 →</span>`
                : `<div class="sc-main"><b>今日待背已清空 🎉</b><div class="sc-sub">可点入提前背未到期的词</div></div><span class="sc-go">去背单词 →</span>`;
            curCta = `<a class="study-cta" href="study.html?deck=${esc(viewDeck)}">${cta}</a>`;
            shown = 0;
            renderPage();
        }

        /** 生成单张词卡 HTML */
        function cardHtml(v) {
            const inT = (Array.isArray(v.decks) ? v.decks : ['default']).includes(curActive);
            return `
                <div class="item-card">
                    <div class="ic-head">
                        <span><span class="ic-word">${esc(v.word)}</span>
                        <span class="ic-phonetic">${esc(v.phonetic || '')}</span></span>
                        <button class="ic-fav ${inT ? 'on' : ''}" onclick="toggleFav('${esc(v.word).replace(/'/g, "\\'")}')" title="收藏到「${esc(deckName(curActive))}」">${inT ? '★' : '☆'}</button>
                    </div>
                    <div class="ic-meaning">${esc(v.meaning || '')}</div>
                    ${typeof freqBadge === 'function' ? freqBadge(v.word) : ''}
                    <div class="ic-foot">
                        <span>${esc(v.added_at || '')}</span>
                        <span class="ic-actions">
                            ${v.article_id ? `<a href="article.html?id=${esc(v.article_id)}#${esc(v.sentence_id)}">查看原句 →</a>` : ''}
                            <button class="del" onclick="del('${esc(v.word).replace(/'/g, "\\'")}')">删除</button>
                        </span>
                    </div>
                </div>`;
        }

        /** 分页渲染：首页整体写入，后续「加载更多」仅追加，不重绘已渲染项 */
        function renderPage() {
            const next = curRows.slice(shown, shown + PAGE);
            const first = shown === 0;
            shown += next.length;
            const cardsHtml = next.map(cardHtml).join('');
            const remain = curRows.length - shown;
            const moreBtn = remain > 0
                ? `<button class="load-more" onclick="loadMore()">加载更多（剩 ${remain}）</button>`
                : '';
            if (first) {
                document.getElementById('vocabList').innerHTML =
                    curCta + `<div id="vocabItems">${cardsHtml}</div><div id="loadMoreWrap">${moreBtn}</div>`;
            } else {
                document.getElementById('vocabItems').insertAdjacentHTML('beforeend', cardsHtml);
                document.getElementById('loadMoreWrap').innerHTML = moreBtn;
            }
        }

        function loadMore() { renderPage(); }

        function selectView(id) { viewDeck = id; renderAll(); }

        function onCreateDeck() {
            const name = prompt('新建词书名称：');
            if (!name || !name.trim()) return;
            const id = createDeck(name.trim());
            if (id) { viewDeck = id; renderAll(); }
        }

        function onSetActive(id) { setActiveDeck(id); renderAll(); }

        /** 重学本书：清空该词书（或全部）内所有词的记忆进度 srs，变回新词从头背（可逆性弱，需确认） */
        async function onRelearnDeck(id) {
            const label = id === '__all__' ? '全部生词' : `词书「${deckName(id)}」`;
            const rows = await vocabByDeck(id);
            const learned = rows.filter(v => v.srs);
            if (!learned.length) { alert(`${label}没有已开始学习的词，无需重学。`); return; }
            if (!confirm(`重学${label}？将清空其中 ${learned.length} 个词的记忆进度（复习间隔归零，变回新词从头背），此操作不可撤销。`)) return;
            for (const v of learned) { delete v.srs; await dbPut('vocab', v); }
            localStorage.removeItem('en2_studySession');   // 清掉残留本轮会话，避免恢复到旧队列
            renderAll();
            alert(`已重置 ${learned.length} 个词，去背单词即可从头学。`);
        }

        function onRenameDeck(id) {
            const d = getDeck(id);
            const name = prompt('重命名词书：', d ? d.name : '');
            if (!name || !name.trim()) return;
            renameDeck(id, name.trim());
            renderAll();
        }

        async function onDeleteDeck(id) {
            const d = getDeck(id);
            if (!d || d.builtin) return;
            if (!confirm(`删除词书「${d.name}」？其中仅属于本词书的词也会一并移除。`)) return;
            await deleteDeck(id);
            viewDeck = '__all__';
            renderAll();
        }

        async function onImportDeck(input) {
            const f = input.files && input.files[0];
            if (!f) return;
            const rd = new FileReader();
            rd.onload = async () => {
                try {
                    const body = JSON.parse(rd.result);
                    const name = (body.name || '').trim();
                    const words = Array.isArray(body.words) ? body.words : null;
                    if (!name || !words) throw new Error('格式应为 { name, words:[{word,meaning,...}] }');
                    const items = words.filter(w => w && w.word).map(w => ({
                        word: String(w.word).trim(), meaning: w.meaning || '', phonetic: w.phonetic || '',
                        example_en: w.example_en || '', example_cn: w.example_cn || ''
                    }));
                    if (!items.length) throw new Error('词表为空');
                    const id = createDeck(name);
                    const added = await addWordsBulk(items, id);
                    viewDeck = id;
                    await renderAll();
                    alert(`已导入词书「${name}」，新增 ${added} 个词`);
                } catch (e) {
                    alert('导入失败: ' + e.message);
                }
                input.value = '';
            };
            rd.readAsText(f);
        }

        /** 导入词书的示例模板（下载/预览共用） */
        function deckTemplateObj() {
            return {
                name: '我的自定义词书',
                words: [
                    { word: 'ubiquitous', meaning: 'adj. 无处不在的；普遍存在的', phonetic: '/juːˈbɪkwɪtəs/', example_en: 'Mobile phones are now ubiquitous in daily life.', example_cn: '手机如今在日常生活中无处不在。' },
                    { word: 'mitigate', meaning: 'v. 减轻，缓和；使缓和', phonetic: '/ˈmɪtɪɡeɪt/', example_en: 'The government took steps to mitigate the crisis.', example_cn: '政府采取措施缓解危机。' },
                    { word: 'in light of', meaning: '鉴于；考虑到（词组同样支持，word 里直接写空格即可）' },
                    { word: 'prudent', meaning: 'adj. 谨慎的，慎重的' }
                ]
            };
        }

        /** 导入词书引导：展示 JSON 格式模板 + 下载示例 + 选择文件 */
        function onDeckImportHelp() {
            const tpl = JSON.stringify(deckTemplateObj(), null, 2);
            document.getElementById('deckToolbar').innerHTML = `
                <div class="import-help">
                    <div class="ih-title">导入词书 · JSON 格式模板</div>
                    <div class="ih-desc">文件为一个 JSON 对象，含 <code>name</code>（词书名，必填）和 <code>words</code>（词条数组，必填）。每个词条字段：</div>
                    <ul class="ih-fields">
                        <li><code>word</code>　单词或词组　<b>必填</b></li>
                        <li><code>meaning</code>　中文释义　建议填（背单词时看的就是它）</li>
                        <li><code>phonetic</code>　音标　可选，如 <code>/ˈæpl/</code></li>
                        <li><code>example_en</code>　例句英文　可选</li>
                        <li><code>example_cn</code>　例句中文　可选</li>
                    </ul>
                    <pre class="ih-code">${esc(tpl)}</pre>
                    <div class="ih-tips">提示：文件编码用 UTF-8；导入会新建一本同名词书，重复导入只并入新词、不覆盖已有进度；词组（含空格）也能作为一个词条。</div>
                    <div class="ih-actions">
                        <button class="tb-btn" onclick="downloadDeckTemplate()">⬇ 下载模板文件</button>
                        <button class="tb-btn" onclick="document.getElementById('deckImport').click()">选择文件导入 →</button>
                        <button class="tb-btn" onclick="renderAll()">返回</button>
                    </div>
                </div>`;
        }

        /** 把示例模板导出为 .json 供用户填写 */
        function downloadDeckTemplate() {
            const blob = new Blob([JSON.stringify(deckTemplateObj(), null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '词书模板.json';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        async function del(word) {
            await dbDelete('vocab', word);
            renderAll();
        }

        async function toggleFav(word) {
            await toggleWordInDeck(word, getActiveDeck());
            renderAll();
        }

        // 内置词书（固定 id，随应用发布，点击按需 fetch 导入，可删、重导幂等）
        const BUILTIN_DECKS = [
            { id: 'bd_realexam', name: '真题高频·较难词（历年批注）', file: 'data/deck_realexam.json' },
            { id: 'bd_phrases', name: '真题词组（英语二2014-2024）', file: 'data/deck_phrases.json' },
            { id: 'bd_core', name: '考研真题核心词汇', file: 'data/deck_core.json' },
            { id: 'bd_syllabus', name: '考研考纲词汇（乱序）', file: 'data/deck_syllabus.json' },
            { id: 'bd_confusable', name: '考研形近易混词汇', file: 'data/deck_confusable.json' },
            { id: 'bd_tc_phrases', name: '唐迟·20年高分词组', file: 'data/deck_tc_phrases.json' },
            { id: 'bd_tc_senses', name: '唐迟·熟词僻义', file: 'data/deck_tc_senses.json' },
        ];

        /** 展开内置词书列表到工具栏，各自按需导入 */
        async function onBuiltinDecks() {
            const counts = await deckCounts();
            const btns = BUILTIN_DECKS.map(b => {
                const c = counts[b.id] || 0;
                return `<button class="tb-btn" onclick="onImportBuiltin('${b.id}')">${esc(b.name)}${c ? ` · 已${c}` : ''}</button>`;
            }).join('');
            document.getElementById('deckToolbar').innerHTML =
                `<span class="tb-info">内置词书（点击按需导入）：</span>${btns}<button class="tb-btn" onclick="renderAll()">返回</button>`;
        }

        /** fetch 内置词书 json → ensureDeck + addWordsBulk（已有词则二次确认） */
        async function onImportBuiltin(id) {
            const b = BUILTIN_DECKS.find(x => x.id === id);
            if (!b) return;
            if (getDeck(id)) {
                const counts = await deckCounts();
                if ((counts[id] || 0) > 0 &&
                    !confirm(`「${b.name}」已导入（${counts[id]} 词），重新导入仅并入新词、不覆盖已有进度，继续？`)) return;
            }
            try {
                const res = await fetch(b.file);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const body = await res.json();
                const words = Array.isArray(body.words) ? body.words : [];
                const items = words.filter(w => w && w.word).map(w => ({
                    word: String(w.word).trim(), meaning: w.meaning || '', phonetic: w.phonetic || '',
                    example_en: w.example_en || '', example_cn: w.example_cn || ''
                }));
                if (!items.length) throw new Error('词表为空');
                ensureDeck(id, b.name);
                const added = await addWordsBulk(items, id);
                viewDeck = id;
                await renderAll();
                alert(`已导入内置词书「${b.name}」，新增 ${added} 个词`);
            } catch (e) {
                alert('导入失败: ' + e.message);
            }
        }

        (async () => { await migrateVocabDecks(); if (typeof loadFreq === 'function') { try { await loadFreq(); } catch (e) { /* 徽标降级 */ } } await renderAll(); })();
    </script>
</body>
</html>
