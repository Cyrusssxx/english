<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精读 - 英语二真题精翻</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0d9488">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="mode-read">
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand" title="返回列表">‹ <span id="navTitle">精读</span></a>
            <!-- 本篇备注：紧贴文章标题，点开写点什么（自动保存） -->
            <button class="nav-note" id="artNoteBtn" onclick="event.stopPropagation();toggleArtNote()"
                title="本篇备注：点开写点什么（输入即自动保存，Ctrl+Enter 保存并关闭）">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 4h10l4 4v12H5z" /><path d="M15 4v4h4" /><path d="M8 12.5h8M8 16h5" />
                </svg>
                <span>备注</span>
                <span class="nv-dot" id="artNoteDot" hidden></span>
            </button>
            <div class="nav-tools">
                <div class="nav-search-wrap">
                    <input class="nav-search" id="navSearch" type="search" placeholder="查词" title="输入英文单词/词组或中文后回车（或点🔍）查释义；Alt+C 快速聚焦"
                        onfocus="showSearchHist()" oninput="hideSearchHist()"
                        onkeydown="if(event.key==='Enter')navLookup();else if(event.key==='Escape')hideSearchHist()"
                        onblur="setTimeout(hideSearchHist,150)">
                    <button class="nav-search-btn" id="navSearchBtn" onclick="navLookup()" title="查词（点击或 Alt+C 聚焦后回车）">🔍</button>
                    <div class="nav-search-hist" id="navSearchHist" hidden></div>
                </div>
                <span class="nav-timer" id="navTimer" title="今日学习时长">⏱ 00:00:00</span>
                <button class="nav-timer-btn" id="timerPause" onclick="togglePauseTimer()" title="暂停/继续计时">⏸</button>
                <button class="nav-timer-btn" onclick="resetTimer()" title="重置今日计时">↺</button>
                <button class="nav-switch" id="cnAllSwitch" onclick="toggleCnAll()" title="精读模式：全部译文展开 + 底部本篇词组 + 做题时定位题目句">
                    精读 <span class="switch-state" id="cnAllState">关</span>
                </button>
                <button class="nav-switch" id="hardSwitch" onclick="toggleHard()" title="一键高亮正文较难词/词组">
                    高亮难词 <span class="switch-state" id="hardState">关</span>
                </button>
                <button class="nav-switch" id="sigSwitch" onclick="toggleSig()" title="句子信号染色：转折/因果/引导词/指代/插入语（层级开关在⚙设置里）">
                    信号染色 <span class="switch-state" id="sigState">开</span>
                </button>
                <button class="nav-switch" id="recordBtn" onclick="recordArticleWords()" title="把本篇较难词一键加入当前词书">记录生词</button>
                <button class="nav-switch" id="studyBtn" onclick="window.open('study.html')" title="在新标签页打开背单词卡片页">记单词</button>
                <button class="nav-switch" id="modeSwitch" onclick="toggleMode()" title="精读：逐句看翻译；做题：显示题目面板">
                    做题 <span class="switch-state" id="modeState">关</span>
                </button>
                <button class="nav-switch" id="artSettingsBtn" onclick="event.stopPropagation();toggleArtSettings()" title="设置：查词快捷键、夜间模式、标注备份">⚙ 设置</button>
                <input type="file" id="annImport" accept="application/json" style="display:none" onchange="Annot.importAnnot(this)">
            </div>
        </div>
    </nav>

    <!-- 备注浮窗：锚定在顶栏「备注」小块下方 -->
    <div class="note-pop" id="artNotePop" hidden>
        <div class="np-head">
            <span class="np-title">本篇备注</span>
            <span class="np-meta" id="artNoteMeta">自动保存</span>
            <button class="np-x" onclick="hideArtNote()" title="关闭（Esc）">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <path d="M6 6l12 12M18 6L6 18" />
                </svg>
            </button>
        </div>
        <textarea class="np-area" id="artNoteArea" spellcheck="false"
            placeholder="这篇的注意点、易错项、生词、下次要回看的地方……"
            oninput="onArtNoteInput()" onkeydown="artNoteKey(event)"></textarea>
        <div class="np-foot">
            <span class="np-tip">Ctrl+Enter 保存并关闭</span>
            <span class="np-spacer"></span>
            <button class="np-btn" onclick="clearArtNote()">清空</button>
            <button class="np-btn primary" onclick="saveArtNoteNow()">保存</button>
        </div>
    </div>

    <div class="article-layout">
        <!-- 左：正文精读 -->
        <main class="read-pane" id="readPane">
            <div class="loading">加载中...</div>
        </main>

        <!-- 右：做题面板（精读模式下隐藏；可收缩；窄屏为底部抽屉） -->
        <aside class="quiz-pane" id="quizPane">
            <div class="quiz-head">
                <span class="quiz-head-title">题目</span>
                <button class="quiz-collapse-btn" onclick="resetQuiz()" title="清空本篇作答重新做">清除重做</button>
                <button class="quiz-collapse-btn" onclick="toggleQuizPane()" title="收起题目面板">收起 »</button>
            </div>
            <div class="quiz-scroll" id="quizScroll"></div>
            <div class="quiz-jumpbar" id="quizJumpbar"></div>
        </aside>
    </div>

    <!-- 面板收起后右缘悬浮的展开按钮 -->
    <button class="quiz-expand-tab" onclick="toggleQuizPane()" title="展开题目面板">题目</button>

    <script src="js/common.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/dict.js"></script>
    <script src="js/annotate.js"></script>
    <script src="js/article.js"></script>
    <script>
        // 英语一文章：返回按钮指向英语一阅读入口（而非英语二首页）
        if (typeof AID === 'string' && AID.startsWith('en1_')) {
            const brand = document.querySelector('.nav-brand');
            if (brand) brand.setAttribute('href', 'en1.html');
        }
    </script>
</body>
</html>
